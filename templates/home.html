<!DOCTYPE html>
<html>
<head>
    <title>ML Prediction Pipeline</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type=text] { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        input[type=submit] { width: 100%; background-color: #4CAF50; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .result { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Machine Learning Prediction</h2>
    <form action="/predictdata" method="post">
        <label>Feature 1 Value:</label>
        <input type="text" name="feature1" placeholder="Enter Feature 1" required>

        <label>Feature 2 Value:</label>
        <input type="text" name="feature2" placeholder="Enter Feature 2" required>

        <input type="submit" value="Predict Output">
    </form>

    {% if results %}
    <div class="result">
        <h3>Prediction Result: {{ results }}</h3>
    </div>
    {% endif %}
</div>

</body>
</html>
